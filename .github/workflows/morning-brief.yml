name: Morning Brief

on:
  schedule:
    # Target 08:00 Europe/Istanbul (UTC+3, no DST). GitHub cron is best-effort
    # and top-of-hour slots are the most delayed, so we schedule at 04:40 UTC
    # on an odd minute.
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date YYYY-MM-DD (blank = latest day in data)"
        required: false
      no_llm:
        description: "Skip LLM and send template brief"
        type: boolean
        default: false

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests (fail fast before sending anything)
        run: python -m pytest -q tests

      # In production this step would be replaced by an API pull
      # (see README "API integration note"). The case-study CSVs are in the repo.
      - name: Build brief and deliver
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          BRIEF_LANGUAGE: Turkish
          FX_USD_EUR: "0.92"
        run: |
          ARGS=""
          if [ -n "${{ inputs.report_date }}" ]; then ARGS="$ARGS --date ${{ inputs.report_date }}"; fi
          if [ "${{ inputs.no_llm }}" = "true" ]; then ARGS="$ARGS --no-llm"; fi
          python src/run.py $ARGS

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-brief-${{ github.run_id }}
          path: |
            output/brief.md
            output/brief_audit.json
            output/anomalies.json
            output/data_quality.json
          retention-days: 30
